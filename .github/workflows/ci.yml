name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy (git SHA). Skips build.
        required: true
        type: string

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_fithub
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 10s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra test
      - run: uv run pytest -p no:cacheprovider
        env:
          DJANGO_SETTINGS_MODULE: fithub.test_settings
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test_fithub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fithub:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fithub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: |
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      JENKINS_DEPLOY_URL: ${{ secrets.JENKINS_DEPLOY_URL }}
      JENKINS_USER: ${{ secrets.JENKINS_USER }}
      JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
    steps:
      - name: Trigger Jenkins
        run: |
          set -eu
          : "${JENKINS_DEPLOY_URL:?secret required}" "${JENKINS_USER:?secret required}" "${JENKINS_TOKEN:?secret required}"
          echo "Deploying IMAGE_TAG=${IMAGE_TAG}"
          base="${JENKINS_DEPLOY_URL%%/job/*}"
          crumb_json=$(curl -fsS -u "$JENKINS_USER:$JENKINS_TOKEN" "$base/crumbIssuer/api/json")
          field=$(echo "$crumb_json" | jq -r '.crumbRequestField')
          crumb=$(echo "$crumb_json" | jq -r '.crumb')
          curl -fsS -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" -H "$field: $crumb" \
            --data-urlencode "IMAGE_TAG=${IMAGE_TAG}" "$JENKINS_DEPLOY_URL"
